
name: Build Mahfazati APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mahfazati
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify ZIP File
        run: |
          if [ ! -f Mahfazati.zip ]; then
            echo "ERROR: Mahfazati.zip not found!"
            exit 1
          fi

      - name: Extract Mahfazati Project
        run: |
          mkdir -p build_src
          unzip -q -o Mahfazati.zip -d build_src

          if [ ! -f build_src/settings.gradle.kts ] || [ ! -f build_src/app/build.gradle.kts ]; then
            echo "ERROR: Android project files not found!"
            find build_src -maxdepth 4 -type f
            exit 1
          fi

          echo "Project extracted successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: build_src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="build_src/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload Mahfazati APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazati-APK
          path: build_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
