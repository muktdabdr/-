
name: Build Mahfazati APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project Files Automatically
        run: |
          mkdir -p build_src

          find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print0 | while IFS= read -r -d '' file; do
              echo "Extracting: $file"
              unzip -q -o "$file" -d build_src
            done

      - name: Detect Android Project
        id: project
        run: |
          PROJECT_DIR=""

          if [ -f "build_src/gradlew" ] || \
             [ -f "build_src/build.gradle" ] || \
             [ -f "build_src/build.gradle.kts" ]; then
            PROJECT_DIR="build_src"
          else
            PROJECT_DIR=$(find build_src -type f \
              \( -name "gradlew" -o \
                 -name "build.gradle" -o \
                 -name "build.gradle.kts" \) \
              -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android Gradle project not found!"
              find build_src -maxdepth 4 -type f
              exit 1
            fi
          fi

          echo "Detected project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazati-APK
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
