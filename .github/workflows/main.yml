
name: Build Mahfazati APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mahfazati
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          test -f Mahfazati.zip || {
            echo "Mahfazati.zip not found"
            exit 1
          }

      - name: Extract Project
        run: |
          mkdir -p build_src
          unzip -q -o Mahfazati.zip -d build_src

          test -f build_src/settings.gradle.kts
          test -f build_src/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: build_src
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="build_src/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Mahfazati APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazati-APK
          path: build_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
