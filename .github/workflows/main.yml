
name: Build Mahfazati Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mahfazati APK and AAB
    runs-on: ubuntu-latest

    env:
      MAHFAZATI_STORE_PASSWORD: ${{ secrets.MAHFAZATI_STORE_PASSWORD }}
      MAHFAZATI_KEY_ALIAS: ${{ secrets.MAHFAZATI_KEY_ALIAS }}
      MAHFAZATI_KEY_PASSWORD: ${{ secrets.MAHFAZATI_KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept SDK Licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK 36
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract Project
        run: |
          test -f Mahfazati.zip
          mkdir -p build_src
          unzip -q -o Mahfazati.zip -d build_src
          test -f build_src/settings.gradle.kts
          test -f build_src/app/build.gradle.kts

      - name: Prepare Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MAHFAZATI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$MAHFAZATI_STORE_PASSWORD" ] || \
             [ -z "$MAHFAZATI_KEY_ALIAS" ] || \
             [ -z "$MAHFAZATI_KEY_PASSWORD" ]; then
            echo "ERROR: Release signing secrets are missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > build_src/app/upload-keystore.jks

          test -s build_src/app/upload-keystore.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK and AAB
        working-directory: build_src
        run: |
          gradle assembleRelease bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify Release Files
        run: |
          APK="build_src/app/build/outputs/apk/release/app-release.apk"
          AAB="build_src/app/build/outputs/bundle/release/app-release.aab"

          test -f "$APK"
          test -f "$AAB"

          ls -lh "$APK" "$AAB"

      - name: Upload Release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Mahfazati-1.2.0-Release
          path: |
            build_src/app/build/outputs/apk/release/app-release.apk
            build_src/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
